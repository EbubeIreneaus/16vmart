services:
    api:
        build: ./api
        container_name: api
        working_dir: /app
        command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
        environment:
            - DB_URL=postgresql+asyncpg://postgres:178420443@host.docker.internal:5432/16vmart
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PASS=
            - REDIS_USER=
            - REDIS_SSL=false
        env_file:
            - ./api/.env
        ports:
            - "8000:8000"
        volumes:
            - ./api:/app
            - /app/.venv
        depends_on:
            - redis

    redis:
        image: redis:7-alpine
        container_name: redis
        environment:
            - HOST=localhost
            - PORT=6379
        ports:
            - "6379:6379"
    